name: Generate

 DOCX

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install docxtpl jinja2

      - name: Generate DOCX
        run: python build3.py

      - name: Upload to OneDrive
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials" | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          curl -s -X PUT \
            "https://graph.microsoft.com/v1.0/users/${{ secrets.ONEDRIVE_USER_EMAIL }}/drive/root:/GeneratedDocs/res6ph.docx:/content" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/vnd.openxmlformats-officedocument.wordprocessingml.document" \
            --data-binary @res6ph.docx
